<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#33222C">
<title>Salon Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#33222C; --ink-soft:#5C4450;
  --rose:#B25B6C; --rose-deep:#93465A; --rose-tint:#F3E2E4;
  --blush:#FBF4F3; --paper:#FFFFFF;
  --sage:#5E7D62; --sage-tint:#E7EFE8;
  --line:#E9DCDB; --muted:#9A8790;
  --danger:#B04141;
  --r-lg:20px; --r-md:12px; --r-sm:8px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Karla',system-ui,sans-serif; background:var(--blush); color:var(--ink);
  font-size:16px; line-height:1.45; overscroll-behavior:none;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
h1,h2,h3,.serif{font-family:'Fraunces',serif}

#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
main{flex:1;padding:20px 18px 96px}

/* ---------- Header ---------- */
.head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
.head h1{font-size:26px;font-weight:600;letter-spacing:-.01em}
.head .date{font-size:14px;color:var(--muted)}

/* ---------- Today ledger strip (the one bold element) ---------- */
.ledger{
  background:var(--ink); color:#F6EBEA; border-radius:var(--r-lg);
  padding:22px 20px 18px; margin-bottom:22px; position:relative; overflow:hidden;
}
.ledger .lbl{font-size:13px;color:#C9A8AF;margin-bottom:2px}
.ledger .big{font-family:'Fraunces',serif;font-size:44px;font-weight:600;line-height:1.05;letter-spacing:-.02em}
.ledger .split{display:flex;gap:26px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(246,235,234,.18)}
.ledger .split div span{display:block}
.ledger .split .k{font-size:12.5px;color:#C9A8AF}
.ledger .split .v{font-family:'Fraunces',serif;font-size:19px;font-weight:600}

/* ---------- Section titles ---------- */
.sec-t{font-family:'Fraunces',serif;font-size:18px;font-weight:600;margin:20px 0 10px}

/* ---------- Appointment rows ---------- */
.appt{
  display:flex;align-items:center;gap:14px;background:var(--paper);
  border:1px solid var(--line);border-radius:var(--r-md);padding:13px 14px;margin-bottom:9px;
}
.appt .time{font-family:'Fraunces',serif;font-weight:600;font-size:16px;min-width:64px;color:var(--rose-deep)}
.appt .info{flex:1;min-width:0}
.appt .who{font-weight:700;font-size:15.5px}
.appt .svc{font-size:13.5px;color:var(--ink-soft)}
.appt .amt{font-family:'Fraunces',serif;font-weight:600;font-size:15px;color:var(--ink-soft);text-align:right}
.appt.done{background:var(--sage-tint);border-color:#D3E1D5}
.appt.done .time{color:var(--sage)}
.appt.done .amt{color:var(--sage)}
.appt.cancelled{opacity:.45}
.appt.cancelled .who{text-decoration:line-through}
.tap{transition:transform .08s ease;cursor:pointer}
.tap:active{transform:scale(.985)}
.appt,.client,.exp-row,.cal .d[data-k]{cursor:pointer}

.empty{
  text-align:center;color:var(--muted);padding:34px 20px;font-size:14.5px;
  border:1.5px dashed var(--line);border-radius:var(--r-md);background:rgba(255,255,255,.5);
}

/* ---------- Primary buttons ---------- */
.btn{
  display:block;width:100%;text-align:center;padding:14px;border-radius:var(--r-md);
  font-weight:700;font-size:15.5px;
}
.btn-rose{background:var(--rose);color:#fff}
.btn-ink{background:var(--ink);color:#fff}
.btn-ghost{background:var(--paper);border:1px solid var(--line);color:var(--ink)}
.btn-sage{background:var(--sage);color:#fff}
.btn-square{background:#111;color:#fff;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-square .sq{width:18px;height:18px;border:2.5px solid #fff;border-radius:4px;position:relative;flex:none}
.btn-square .sq::after{content:'';position:absolute;inset:3px;border:2px solid #fff;border-radius:1px}
.payrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.payrow button{border-radius:12px;min-height:48px;font-weight:700;font-size:14px;color:#fff}
.pay-cashapp{background:#00C244}.pay-venmo{background:#008CFF}.pay-zelle{background:#6D1ED4}
.show-pay{text-align:center}
.show-pay .big{font-size:44px;font-weight:700;margin:4px 0 2px}
.show-pay .to{font-size:15px;color:var(--muted);margin-bottom:14px}
.show-pay .qr{display:inline-block;background:#fff;padding:10px;border-radius:14px;border:1px solid var(--line)}
.show-pay .qr img{width:220px;height:220px;display:block;image-rendering:pixelated}
.show-pay .handle{font-size:22px;font-weight:700;margin:12px 0 4px;word-break:break-all}
.pay-or{text-align:center;color:var(--muted);font-size:12px;margin:10px 0 2px}
.btn-danger-ghost{background:none;color:var(--danger);font-weight:600;font-size:14px;padding:10px}
.btn+.btn{margin-top:9px}

/* ---------- FAB ---------- */
.fab{
  position:fixed;right:calc(50% - 260px + 18px);bottom:86px;width:56px;height:56px;border-radius:50%;
  background:var(--rose);color:#fff;font-size:28px;line-height:1;font-weight:400;
  box-shadow:0 6px 18px rgba(178,91,108,.4);display:flex;align-items:center;justify-content:center;
  z-index:30;
}
@media(max-width:560px){.fab{right:18px}}

/* ---------- Tab bar ---------- */
nav{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:rgba(255,255,255,.96);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);
}
.nav-in{max-width:520px;margin:0 auto;display:flex}
nav button{
  flex:1;padding:10px 0 max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);
}
nav button.on{color:var(--rose-deep)}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Calendar ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head h2{font-size:20px;font-weight:600}
.cal-head button{width:44px;height:44px;border-radius:50%;background:var(--paper);border:1px solid var(--line);font-size:17px}
.cal{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 10px 14px;margin-bottom:16px}
.cal .dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:6px}
.cal .grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px}
.cal .d{
  aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:10px;font-size:14px;position:relative;
}
.cal .d.dim{color:#CDBEC4}
.cal .d.today{outline:2px solid var(--rose);outline-offset:-2px;font-weight:700}
.cal .d.sel{background:var(--ink);color:#fff;font-weight:700}
.cal .d .dot{width:5px;height:5px;border-radius:50%;background:var(--rose);position:absolute;bottom:6px}
.cal .d.sel .dot{background:#F3C9CF}

/* ---------- Clients ---------- */
.client{
  display:flex;align-items:center;gap:13px;background:var(--paper);border:1px solid var(--line);
  border-radius:var(--r-md);padding:13px 14px;margin-bottom:9px;
}
.client .av{
  width:42px;height:42px;border-radius:50%;background:var(--rose-tint);color:var(--rose-deep);
  display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;font-size:17px;
  flex-shrink:0;
}
.client .nm{font-weight:700;font-size:15.5px}
.client .sub{font-size:13px;color:var(--muted)}
.client .info{flex:1;min-width:0}
.search{
  width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-md);
  background:var(--paper);margin-bottom:14px;
}
.search::placeholder{color:var(--muted)}
.search:focus{outline:2px solid var(--rose);outline-offset:-1px}

/* ---------- Earnings ---------- */
.seg{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:18px}
.seg button{flex:1;padding:12px 0;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
.earn-strip{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:20px;margin-bottom:16px;
}
.earn-strip .big{font-family:'Fraunces',serif;font-size:38px;font-weight:600;letter-spacing:-.02em}
.earn-strip .lbl{font-size:13px;color:var(--muted)}
.earn-strip .row3{display:flex;gap:0;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.earn-strip .row3>div{flex:1}
.earn-strip .row3 .k{font-size:12.5px;color:var(--muted)}
.earn-strip .row3 .v{font-family:'Fraunces',serif;font-size:18px;font-weight:600}
.earn-strip .row3 .v.tip{color:var(--sage)}
.chart{display:flex;align-items:flex-end;gap:6px;height:110px;margin:6px 2px 4px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.chart .bar{width:100%;max-width:34px;border-radius:6px 6px 3px 3px;background:var(--rose-tint);position:relative;overflow:hidden;min-height:3px}
.chart .bar .tipfill{position:absolute;left:0;right:0;bottom:0;background:var(--sage);opacity:.85}
.chart .bar .svcfill{position:absolute;left:0;right:0;bottom:0;background:var(--rose)}
.chart .cl{font-size:10.5px;color:var(--muted);font-weight:600}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink-soft);margin-bottom:16px;padding-left:2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.pay-row{
  display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);
  border-radius:var(--r-md);padding:12px 14px;margin-bottom:8px;
}
.pay-row .d{font-size:12.5px;color:var(--muted);min-width:52px}
.pay-row .info{flex:1}
.pay-row .who{font-weight:700;font-size:14.5px}
.pay-row .svc{font-size:12.5px;color:var(--ink-soft)}
.pay-row .amts{text-align:right}
.pay-row .a{font-family:'Fraunces',serif;font-weight:600;font-size:15px}
.pay-row .t{font-size:12px;color:var(--sage);font-weight:700}

.earn-strip .row3 .v.exp{color:var(--danger)}
.exp-row{
  display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);
  border-radius:var(--r-md);padding:12px 14px;margin-bottom:8px;
}
.exp-row .d{font-size:12.5px;color:var(--muted);min-width:52px}
.exp-row .info{flex:1;min-width:0}
.exp-row .cat{font-weight:700;font-size:14.5px}
.exp-row .nt{font-size:12.5px;color:var(--ink-soft)}
.exp-row .a{font-family:'Fraunces',serif;font-weight:600;font-size:15px;color:var(--danger)}

/* ---------- Modal sheet ---------- */
.veil{position:fixed;inset:0;background:rgba(51,34,44,.45);z-index:50;display:none}
.veil.open{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:60;max-width:520px;margin:0 auto;
  background:var(--blush);border-radius:22px 22px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto;transform:translateY(105%);transition:transform .22s ease;
}
.sheet.open{transform:translateY(0)}
.sheet .grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 14px}
.sheet h2{font-size:21px;font-weight:600;margin-bottom:16px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:6px}
.fld input,.fld select,.fld textarea{
  width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--paper);
}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--rose);outline-offset:-1px}
.fld-row{display:flex;gap:10px}
.fld-row .fld{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  padding:11px 16px;border-radius:999px;background:var(--paper);border:1px solid var(--line);
  font-size:13.5px;font-weight:600;min-height:44px;
}
.chip.on{background:var(--rose);border-color:var(--rose);color:#fff}
.tipbtns{display:flex;gap:8px}
.tipbtns button{
  flex:1;padding:13px 0;border-radius:var(--r-md);background:var(--paper);border:1px solid var(--line);
  font-weight:700;font-size:14px;
}
.tipbtns button.on{background:var(--sage);border-color:var(--sage);color:#fff}
.note{font-size:12.5px;color:var(--muted);margin-top:4px}

/* Client detail history */
.hist{border-left:2px solid var(--rose-tint);margin:6px 0 16px 6px;padding-left:14px}
.hist .h-row{margin-bottom:10px}
.hist .h-d{font-size:12px;color:var(--muted);font-weight:700}
.hist .h-s{font-size:14px}

.toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;
  opacity:0;transition:all .25s ease;z-index:80;pointer-events:none;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.settings-link{display:block;text-align:center;color:var(--muted);font-size:13px;font-weight:600;padding:14px;margin-top:8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <main id="main"></main>
  <button class="fab" id="fab" aria-label="New appointment">+</button>
  <nav>
    <div class="nav-in">
      <button data-v="today" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Today</button>
      <button data-v="cal"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</button>
      <button data-v="clients"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>Clients</button>
      <button data-v="earn"><svg viewBox="0 0 24 24"><path d="M4 19V9m6 10V5m6 14v-7"/><path d="M2 21h20"/></svg>Earnings</button>
    </div>
  </nav>
</div>
<div class="veil" id="veil"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   Salon Studio — solo stylist booking & earnings
   Single-file, offline-first, localStorage
   ========================================================= */
const LS_KEY='salon_studio_v1';
const LS_LEGACY='hyona_studio_v1';
const SERVICES=['Haircut','Color','Perm','Highlights','Blowout','Treatment','Style','Other'];
const EXPENSE_CATS=['Supplies','Products','Rent','Utilities','Equipment','Other'];

let db=load();
function load(){
  try{
    if(!localStorage.getItem(LS_KEY)&&localStorage.getItem(LS_LEGACY)){
      localStorage.setItem(LS_KEY,localStorage.getItem(LS_LEGACY));
    }
  }catch(e){}
  try{const d=JSON.parse(localStorage.getItem(LS_KEY));if(d&&d.appts&&d.clients){if(!d.expenses)d.expenses=[];if(!d.staff)d.staff=[];if(!d.owner)d.owner={name:''};return d;}}catch(e){}
  return {appts:[],clients:[],expenses:[],staff:[],owner:{name:''}};
}
function save(){localStorage.setItem(LS_KEY,JSON.stringify(db));}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- date helpers ---------- */
const fmt$=n=>{const s=n<0?'-':'';const v=Math.abs(Math.round(n*100)/100);return s+'$'+v.toLocaleString('en-US',{minimumFractionDigits:(v%1?2:0),maximumFractionDigits:2});};
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseYmd(s){const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c);}
const todayStr=()=>ymd(new Date());
function niceDate(s,short){
  const d=parseYmd(s);
  const o=short?{month:'short',day:'numeric'}:{weekday:'long',month:'long',day:'numeric'};
  return d.toLocaleDateString('en-US',o);
}
function nice12(t){
  let[h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';h=h%12||12;
  return h+':'+String(m).padStart(2,'0')+' '+ap;
}
function clientName(id){const c=db.clients.find(c=>c.id===id);return c?c.name:'Walk-in';}
const meLabel=()=>(db.owner&&db.owner.name)?db.owner.name:'Me';
function staffName(id){if(!id||id==='me')return '';const s=db.staff.find(x=>x.id===id);return s?s.name:'Staff';}
function initials(n){return n.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();}

/* ---------- state ---------- */
let view='today';
let calCursor=new Date(); calCursor.setDate(1);
let calSel=todayStr();
let calFocusSel=false; /* restore focus to the selected day after keyboard selection */
let earnMode='day';
let earnStaff='all';
let clientQ='';

/* ---------- toast ---------- */
let toastT;
function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800);
}

/* ---------- sheet ---------- */
const veil=document.getElementById('veil'),sheet=document.getElementById('sheet');
function openSheet(html){sheet.innerHTML='<div class="grip"></div>'+html;veil.classList.add('open');requestAnimationFrame(()=>sheet.classList.add('open'));}
function closeSheet(){sheet.classList.remove('open');veil.classList.remove('open');setTimeout(()=>{if(!sheet.classList.contains('open'))sheet.innerHTML='';},250);}
veil.onclick=closeSheet;

/* =========================================================
   RENDER
   ========================================================= */
const main=document.getElementById('main');
function render(){
  if(view==='today')renderToday();
  else if(view==='cal')renderCal();
  else if(view==='clients')renderClients();
  else renderEarn();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  const fab=document.getElementById('fab');
  fab.style.display='flex';
  fab.setAttribute('aria-label',view==='clients'?'New client':view==='earn'?'New expense':'New appointment');
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render();});
document.getElementById('fab').onclick=()=>{
  if(view==='clients')clientForm();
  else if(view==='earn')expenseForm();
  else apptForm(null,view==='cal'?calSel:todayStr());
};

/* ---------- shared: appointment row ---------- */
function whoDid(a){
  if(!db.staff.length)return '';
  return (!a.staffId||a.staffId==='me')?meLabel():staffName(a.staffId);
}
function apptRow(a){
  const paid=a.status==='done'&&a.payment;
  const amt=paid?fmt$(a.payment.amount+a.payment.tip):(a.price?fmt$(a.price):'');
  return `<div class="appt tap ${a.status}" data-id="${a.id}" role="button" tabindex="0">
    <div class="time">${nice12(a.time)}</div>
    <div class="info">
      <div class="who">${esc(clientName(a.clientId)||a.walkName||'Walk-in')}</div>
      <div class="svc">${esc(a.service)}${whoDid(a)?' · '+esc(whoDid(a)):''}${paid&&a.payment.tip?` · tip ${fmt$(a.payment.tip)}`:''}</div>
    </div>
    <div class="amt">${amt}</div>
  </div>`;
}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
/* keyboard activation for row-style buttons: Enter/Space without the Space page-scroll */
function keyAct(e,fn){if(e.key==='Enter'||e.key===' '){e.preventDefault();fn();}}
function bindApptRows(root){
  root.querySelectorAll('.appt').forEach(el=>{
    el.onclick=()=>apptDetail(el.dataset.id);
    el.onkeydown=e=>keyAct(e,()=>apptDetail(el.dataset.id));
  });
}

/* =========================================================
   TODAY
   ========================================================= */
function dayPayments(dateStr){
  return db.appts.filter(a=>a.date===dateStr&&a.status==='done'&&a.payment);
}
function renderToday(){
  const t=todayStr();
  const appts=db.appts.filter(a=>a.date===t).sort((a,b)=>a.time.localeCompare(b.time));
  const pays=dayPayments(t);
  const svc=pays.reduce((s,a)=>s+a.payment.amount,0);
  const tip=pays.reduce((s,a)=>s+a.payment.tip,0);
  const upcoming=appts.filter(a=>a.status==='booked');
  const doneList=appts.filter(a=>a.status!=='booked');
  const fresh=!db.appts.length&&!db.clients.length&&!db.expenses.length;

  main.innerHTML=`
    <div class="head"><h1>Today</h1><div class="date">${niceDate(t)}</div></div>
    <div class="ledger">
      <div class="lbl">Today's take</div>
      <div class="big">${fmt$(svc+tip)}</div>
      <div class="split">
        <div><span class="k">Services</span><span class="v">${fmt$(svc)}</span></div>
        <div><span class="k">Tips</span><span class="v">${fmt$(tip)}</span></div>
        <div><span class="k">Clients seen</span><span class="v">${pays.length}</span></div>
      </div>
    </div>
    <div class="sec-t">Up next</div>
    ${upcoming.length?upcoming.map(apptRow).join(''):`<div class="empty">No appointments scheduled.<br>Tap + to book one.${fresh?'<br><br><button class="chip" id="sampleBtn" style="background:var(--rose);border-color:var(--rose);color:#fff">See it with example data</button>':''}</div>`}
    ${doneList.length?`<div class="sec-t">Finished</div>${doneList.map(apptRow).join('')}`:''}
    <button class="settings-link" id="backupBtn">Settings</button>
  `;

}

/* =========================================================
   CALENDAR
   ========================================================= */
function renderCal(){
  const y=calCursor.getFullYear(),m=calCursor.getMonth();
  const first=new Date(y,m,1),startDow=first.getDay(),days=new Date(y,m+1,0).getDate();
  const prevDays=new Date(y,m,0).getDate();
  const cells=[];
  for(let i=startDow-1;i>=0;i--)cells.push({d:prevDays-i,dim:true,key:null});
  for(let d=1;d<=days;d++){
    const key=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    cells.push({d,dim:false,key});
  }
  let nextD=1;
  while(cells.length%7)cells.push({d:nextD++,dim:true,key:null});
  const hasAppt=k=>db.appts.some(a=>a.date===k&&a.status!=='cancelled');
  const t=todayStr();
  const monthName=first.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const dayAppts=db.appts.filter(a=>a.date===calSel).sort((a,b)=>a.time.localeCompare(b.time));

  main.innerHTML=`
    <div class="head"><h1>Calendar</h1></div>
    <div class="cal-head">
      <button id="pm" aria-label="Previous month">‹</button>
      <h2 class="serif">${monthName}</h2>
      <button id="nm" aria-label="Next month">›</button>
    </div>
    <div class="cal">
      <div class="dow"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
      <div class="grid">${cells.map(c=>`
        <div class="d ${c.dim?'dim':''} ${c.key===t?'today':''} ${c.key===calSel?'sel':''}" ${c.key?`data-k="${c.key}"`:''}>
          ${c.d}${c.key&&hasAppt(c.key)?'<span class="dot"></span>':''}
        </div>`).join('')}
      </div>
    </div>
    <div class="sec-t">${niceDate(calSel)}</div>
    ${dayAppts.length?dayAppts.map(apptRow).join(''):`<div class="empty">Nothing booked this day.<br>Tap + to add an appointment.</div>`}
  `;
  document.getElementById('pm').onclick=()=>{calCursor.setMonth(m-1);render();};
  document.getElementById('nm').onclick=()=>{calCursor.setMonth(m+1);render();};
  main.querySelectorAll('.d[data-k]').forEach(el=>{
    el.onclick=()=>{calSel=el.dataset.k;render();};
    el.tabIndex=0;
    el.setAttribute('role','button');
    el.setAttribute('aria-label','Select '+niceDate(el.dataset.k));
    el.onkeydown=e=>keyAct(e,()=>{calFocusSel=true;calSel=el.dataset.k;render();});
  });
  bindApptRows(main);
  if(calFocusSel){calFocusSel=false;const s=main.querySelector('.d.sel');if(s)s.focus();}
}

/* ---------- checkout with tips ---------- */
function checkout(id,draft){
  const a=db.appts.find(x=>x.id===id);if(!a)return;
  const p=draft||a.payment||{};
  const baseAmt=p.amount??a.price??'';
  openSheet(`
    <h2 class="serif">Take payment</h2>
    <div class="note" style="margin:-8px 0 14px">${esc(clientName(a.clientId))} · ${esc(a.service)}</div>
    <div class="fld"><label>Service amount ($)</label>
      <input id="p-amt" type="number" inputmode="decimal" min="0" step="0.01" value="${baseAmt}"></div>
    <div class="fld"><label>Tip</label>
      <div class="tipbtns" id="tipB">
        <button type="button" data-p="0.15">15%</button>
        <button type="button" data-p="0.18">18%</button>
        <button type="button" data-p="0.20">20%</button>
        <button type="button" data-p="0.25">25%</button>
      </div>
      <input id="p-tip" type="number" inputmode="decimal" min="0" step="0.01" value="${p.tip??''}" placeholder="Custom tip $" style="margin-top:8px">
    </div>
    <div class="fld"><label>Paid by</label>
      <div class="chips" id="mB">
        ${['Cash','Card','Venmo','Zelle','Cash App','Other'].map(m=>`<button type="button" class="chip ${p.method===m?'on':''}" data-m="${m}">${m}</button>`).join('')}
      </div>
    </div>
    <div class="fld"><label>Total</label><div class="serif" id="p-total" style="font-size:30px;font-weight:600">$0</div></div>
    <button class="btn btn-square" id="sqP"><span class="sq"></span><span id="sqL">Charge on Square</span></button>
    <div class="payrow">
      <button type="button" class="pay-cashapp" data-app="cashapp">Cash App</button>
      <button type="button" class="pay-venmo" data-app="venmo">Venmo</button>
      <button type="button" class="pay-zelle" data-app="zelle">Zelle</button>
    </div>
    <div class="pay-or">or, if paid another way</div>
    <button class="btn btn-sage" id="doneP">Done — record payment</button>
  `);
  const amtEl=document.getElementById('p-amt'),tipEl=document.getElementById('p-tip'),totEl=document.getElementById('p-total');
  let method=p.method||'';
  function recalc(){
    const t=(parseFloat(amtEl.value)||0)+(parseFloat(tipEl.value)||0);
    totEl.textContent=fmt$(t);
    const L=document.getElementById('sqL');if(L)L.textContent='Charge '+fmt$(t)+' on Square';
  }
  amtEl.oninput=recalc;tipEl.oninput=()=>{clearTipSel();recalc();};
  function clearTipSel(){document.querySelectorAll('#tipB button').forEach(b=>b.classList.remove('on'));}
  document.querySelectorAll('#tipB button').forEach(b=>b.onclick=()=>{
    const amt=parseFloat(amtEl.value)||0;
    tipEl.value=(Math.round(amt*parseFloat(b.dataset.p)*100)/100).toString();
    clearTipSel();b.classList.add('on');recalc();
  });
  document.querySelectorAll('#mB .chip').forEach(c=>c.onclick=()=>{
    method=c.dataset.m;
    document.querySelectorAll('#mB .chip').forEach(x=>x.classList.toggle('on',x===c));
  });
  recalc();
  document.getElementById('doneP').onclick=()=>{
    const amount=parseFloat(amtEl.value);
    if(isNaN(amount)||amount<0){toast('Enter the service amount');amtEl.focus();return;}
    a.status='done';
    a.payment={amount,tip:parseFloat(tipEl.value)||0,method};
    save();closeSheet();render();toast('Payment recorded');
  };
  document.getElementById('sqP').onclick=()=>{
    const amount=parseFloat(amtEl.value);
    if(isNaN(amount)||amount<0){toast('Enter the service amount');amtEl.focus();return;}
    squareCharge(a,amount,parseFloat(tipEl.value)||0);
  };
  document.querySelectorAll('.payrow [data-app]').forEach(b=>b.onclick=()=>{
    const amount=parseFloat(amtEl.value);
    if(isNaN(amount)||amount<0){toast('Enter the service amount');amtEl.focus();return;}
    showP2P(a,b.dataset.app,amount,parseFloat(tipEl.value)||0);
  });
}

/* =========================================================
   PAYMENT CONNECT — Cash App, Venmo, Zelle
   The client pays from their own phone: Chairbook shows a QR code
   (Cash App and Venmo open with the amount filled in) or the Zelle
   contact, then the stylist taps "Received" once the money is in.
   These apps do not report payments back to other apps, so the
   stylist confirms.
   ========================================================= */
const P2P={
  cashapp:{name:'Cash App',cls:'pay-cashapp',key:'cashtag',label:'Your $Cashtag',ph:'$YourCashtag',
    clean:v=>{v=v.trim().replace(/^https?:\/\/cash\.app\//i,'').replace(/^\$/,'');return v?'$'+v:'';},
    link:(h,t)=>'https://cash.app/'+encodeURIComponent(h)+'/'+t.toFixed(2)},
  venmo:{name:'Venmo',cls:'pay-venmo',key:'venmo',label:'Your Venmo username',ph:'@your-name',
    clean:v=>{v=v.trim().replace(/^https?:\/\/(account\.)?venmo\.com\/(u\/)?/i,'').replace(/^@/,'');return v?'@'+v:'';},
    link:(h,t,note)=>'https://venmo.com/'+encodeURIComponent(h.replace(/^@/,''))+'?txn=pay&amount='+t.toFixed(2)+'&note='+encodeURIComponent(note)},
  zelle:{name:'Zelle',cls:'pay-zelle',key:'zelle',label:'Your Zelle email or phone',ph:'name@email.com or (210) 555-0123',
    clean:v=>v.trim(),link:null}
};
function payHandles(){return db.payHandles||(db.payHandles={});}
function qrImg(text){try{const q=qrcode(0,'M');q.addData(text);q.make();return q.createDataURL(6,2);}catch(e){return '';}}
function showP2P(a,app,amount,tip){
  const P=P2P[app];const h=payHandles()[P.key]||'';
  if(!h){toast('Add your '+P.name+' in Settings first');backupSheet();return;}
  const total=amount+tip;const note=(a.service+' · '+(db.owner&&db.owner.name?db.owner.name:'Chairbook')).slice(0,60);
  const link=P.link?P.link(h,total,note):'';
  openSheet(`
    <div class="show-pay">
      <div class="note">Show this to ${esc(clientName(a.clientId))}</div>
      <div class="big serif">${fmt$(total)}</div>
      <div class="to">${P.name}${tip?' \u00b7 includes '+fmt$(tip)+' tip':''}</div>
      ${link?`<div class="qr"><img alt="${P.name} QR code" src="${qrImg(link)}"></div>
        <div class="note" style="margin-top:8px">Scan with the phone camera \u2014 ${P.name} opens with ${fmt$(total)} filled in.</div>`
        :`<div class="note">Pay with Zelle in your banking app to:</div>`}
      <div class="handle">${esc(h)}</div>
      ${link?'':`<div class="note">Amount: ${fmt$(total)}. Zelle doesn\u2019t allow a pre-filled amount, so check the amount you receive.</div>`}
    </div>
    <button class="btn btn-sage" id="p2pYes" style="margin-top:16px">Received \u2014 record ${fmt$(total)} by ${P.name}</button>
    <button class="btn btn-ghost" id="p2pBack">Back</button>`);
  document.getElementById('p2pYes').onclick=()=>{
    a.status='done';a.payment={amount,tip,method:P.name};save();closeSheet();render();toast('Paid by '+P.name+' \u00b7 '+fmt$(total));
  };
  document.getElementById('p2pBack').onclick=()=>checkout(a.id,{amount,tip});
}

/* =========================================================
   PAYMENT CONNECT — Square Point of Sale (app switch)
   Chairbook hands the amount to the Square Point of Sale app; the
   card is read by the seller's Square reader (or Tap to Pay) inside
   Square. Square sends the result back to Chairbook, which records
   the payment. No card data ever passes through Chairbook.
   ========================================================= */
const SQ_DEFAULT_APP_ID='';                 // HAKOYA's Square application ID (Point of Sale API)
const SQ_PENDING='chairbook_sq_pending';
function sqAppId(){return (db.square&&db.square.appId)||SQ_DEFAULT_APP_ID;}
function isNativeApp(){const C=window.Capacitor;return !!(C&&C.isNativePlatform&&C.isNativePlatform());}
function sqCallbackURL(){return isNativeApp()?'chairbook://square':location.origin+location.pathname;}
function squareCharge(a,amount,tip){
  const appId=sqAppId();
  if(!appId){toast('Add your Square Application ID in Settings first');return;}
  const cents=Math.round((amount+tip)*100);
  if(cents<100){toast('Square needs at least $1.00 for a card payment');return;}
  const pending={apptId:a.id,amount,tip,cents,at:Date.now()};
  try{localStorage.setItem(SQ_PENDING,JSON.stringify(pending));}catch(e){}
  const data={
    amount_money:{amount:cents,currency_code:'USD'},
    callback_url:sqCallbackURL(),
    client_id:appId,
    version:'1.3',
    notes:('Chairbook · '+clientName(a.clientId)+' · '+a.service).slice(0,500),
    state:a.id,
    options:{supported_tender_types:['CREDIT_CARD','CASH','OTHER','SQUARE_GIFT_CARD','CARD_ON_FILE'],auto_return:true}
  };
  closeSheet();
  location.href='square-commerce-v1://payment/create?data='+encodeURIComponent(JSON.stringify(data));
  // If Square isn't installed, nothing opens: tell the seller.
  setTimeout(()=>{if(document.visibilityState==='visible'&&sqPending()&&Date.now()-sqPending().at<4000)
    toast('Square didn\u2019t open. Install Square Point of Sale and sign in.');},2500);
}
function sqPending(){try{return JSON.parse(localStorage.getItem(SQ_PENDING)||'null');}catch(e){return null;}}
function sqClear(){try{localStorage.removeItem(SQ_PENDING);}catch(e){}}
const SQ_ERRORS={
  payment_canceled:'Payment canceled in Square.',
  not_logged_in:'Sign in to Square Point of Sale, then try again.',
  user_not_active:'This Square account is not activated for card payments yet.',
  amount_too_small:'Amount is below Square\u2019s card minimum ($1.00).',
  amount_too_large:'Amount is above Square\u2019s card limit.',
  could_not_perform:'Square has an unfinished sale open. Finish or cancel it in Square, then try again.',
  no_network_connection:'Square needs an internet connection to start the payment.',
  client_not_authorized_for_user:'Square has not authorized Chairbook for this account yet.',
  unsupported_api_version:'Update the Square Point of Sale app, then try again.',
  data_invalid:'Square rejected the request (data invalid).'
};
function sqHandleResult(r){
  const p=sqPending();
  const apptId=r.state||(p&&p.apptId);
  const a=db.appts.find(x=>x.id===apptId);
  if(r.status!=='ok'){
    sqClear();
    const msg=SQ_ERRORS[r.error_code]||('Square: '+(r.error_code||'payment not completed'));
    toast(msg);
    if(a&&r.error_code!=='payment_canceled')setTimeout(()=>checkout(a.id),400);
    return;
  }
  if(!a){sqClear();toast('Square payment done, but the booking was not found. Record it by hand.');return;}
  const amount=p&&p.apptId===a.id?p.amount:(a.price||0);
  const tip=p&&p.apptId===a.id?p.tip:0;
  a.status='done';
  a.payment={amount,tip,method:'Card',processor:'Square',txn:r.transaction_id||r.client_transaction_id||''};
  save();sqClear();render();
  toast('Paid on Square \u00b7 '+fmt$(amount+tip));
}
function sqReadURL(u){
  try{
    const url=new URL(u);const d=url.searchParams.get('data');if(!d)return false;
    const r=JSON.parse(d);if(!r||!r.status)return false;
    sqHandleResult(r);return true;
  }catch(e){return false;}
}
function sqCheckReturn(){
  // Web: Square returns to this page with ?data={...}
  if(sqReadURL(location.href)){history.replaceState(null,'',location.origin+location.pathname);return;}
  // Back without a result (seller switched apps by hand): ask.
  const p=sqPending();
  if(p&&Date.now()-p.at>4000){
    const a=db.appts.find(x=>x.id===p.apptId);
    if(!a||a.status==='done'){sqClear();return;}
    openSheet(`
      <h2 class="serif">Did the Square payment go through?</h2>
      <div class="note" style="margin:-8px 0 14px">${esc(clientName(a.clientId))} \u00b7 ${esc(a.service)} \u00b7 ${fmt$(p.amount+p.tip)}</div>
      <button class="btn btn-sage" id="sqYes">Yes \u2014 record as paid by card</button>
      <button class="btn btn-ghost" id="sqNo">No \u2014 not paid</button>`);
    document.getElementById('sqYes').onclick=()=>{a.status='done';a.payment={amount:p.amount,tip:p.tip,method:'Card',processor:'Square',txn:''};save();sqClear();closeSheet();render();toast('Payment recorded');};
    document.getElementById('sqNo').onclick=()=>{sqClear();closeSheet();};
  }
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')setTimeout(sqCheckReturn,600);});

/* =========================================================
   EARNINGS
   ========================================================= */
function rangeFor(mode){
  const now=new Date();
  if(mode==='day'){const s=todayStr();return{from:s,to:s,label:'Today'};}
  if(mode==='week'){
    const d=new Date(now);d.setDate(d.getDate()-d.getDay()); // Sunday start
    const e=new Date(d);e.setDate(e.getDate()+6);
    return{from:ymd(d),to:ymd(e),label:'This week'};
  }
  const s=new Date(now.getFullYear(),now.getMonth(),1);
  const e=new Date(now.getFullYear(),now.getMonth()+1,0);
  return{from:ymd(s),to:ymd(e),label:now.toLocaleDateString('en-US',{month:'long'})};
}
function paysBetween(from,to){
  return db.appts.filter(a=>a.status==='done'&&a.payment&&a.date>=from&&a.date<=to);
}
function expensesBetween(from,to){
  return db.expenses.filter(e=>e.date>=from&&e.date<=to);
}
function renderEarn(){
  const r=rangeFor(earnMode);
  const fp=(from,to)=>paysBetween(from,to).filter(a=>earnStaff==='all'||(a.staffId||'me')===earnStaff);
  const pays=fp(r.from,r.to).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  const svc=pays.reduce((s,a)=>s+a.payment.amount,0);
  const tip=pays.reduce((s,a)=>s+a.payment.tip,0);
  const exps=expensesBetween(r.from,r.to).sort((a,b)=>b.date.localeCompare(a.date));
  const expTotal=exps.reduce((s,e)=>s+e.amount,0);
  const net=svc+tip-expTotal;

  /* chart buckets */
  let buckets=[];
  if(earnMode==='day'){
    // hourly is overkill; show last 7 days for context
    for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=ymd(d);
      buckets.push({label:d.toLocaleDateString('en-US',{weekday:'narrow'}),key:k,from:k,to:k});}
  }else if(earnMode==='week'){
    const start=parseYmd(r.from);
    for(let i=0;i<7;i++){const d=new Date(start);d.setDate(d.getDate()+i);const k=ymd(d);
      buckets.push({label:d.toLocaleDateString('en-US',{weekday:'narrow'}),key:k,from:k,to:k});}
  }else{
    // month: 6 monthly buckets ending this month
    for(let i=5;i>=0;i--){
      const s=new Date(new Date().getFullYear(),new Date().getMonth()-i,1);
      const e=new Date(s.getFullYear(),s.getMonth()+1,0);
      buckets.push({label:s.toLocaleDateString('en-US',{month:'narrow'}),from:ymd(s),to:ymd(e)});
    }
  }
  const bdata=buckets.map(b=>{
    const ps=fp(b.from,b.to);
    return{...b,svc:ps.reduce((s,a)=>s+a.payment.amount,0),tip:ps.reduce((s,a)=>s+a.payment.tip,0)};
  });
  const maxV=Math.max(1,...bdata.map(b=>b.svc+b.tip));

  main.innerHTML=`
    <div class="head"><h1>Earnings</h1></div>
    <div class="seg">
      ${['day','week','month'].map(m=>`<button data-m="${m}" class="${earnMode===m?'on':''}">${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}
    </div>
    ${db.staff.length?`<div class="chips" id="stFilter" style="margin:-8px 0 16px">
      <button type="button" class="chip ${earnStaff==='all'?'on':''}" data-st="all">Everyone</button>
      <button type="button" class="chip ${earnStaff==='me'?'on':''}" data-st="me">${esc(meLabel())}</button>
      ${db.staff.map(s=>`<button type="button" class="chip ${earnStaff===s.id?'on':''}" data-st="${s.id}">${esc(s.name)}</button>`).join('')}
    </div>`:''}
    <div class="earn-strip">
      <div class="lbl">${r.label}${earnStaff!=='all'?' · '+(earnStaff==='me'?esc(meLabel()):esc(staffName(earnStaff))):''}</div>
      <div class="big">${fmt$(svc+tip)}</div>
      <div class="row3">
        <div><div class="k">Services</div><div class="v">${fmt$(svc)}</div></div>
        <div><div class="k">Tips</div><div class="v tip">${fmt$(tip)}</div></div>
        <div><div class="k">Clients</div><div class="v">${pays.length}</div></div>
      </div>
      ${earnStaff==='all'?`<div class="row3">
        <div><div class="k">Expenses</div><div class="v exp">${expTotal?'\u2212'+fmt$(expTotal):'$0'}</div></div>
        <div><div class="k">Net</div><div class="v">${fmt$(net)}</div></div>
        <div></div>
      </div>`:''}
    </div>
    <div class="chart">
      ${bdata.map(b=>{
        const tot=b.svc+b.tip,h=Math.round(tot/maxV*100);
        return`<div class="col">
          <div class="bar" style="height:${Math.max(h,tot?4:3)}%">
            <div class="svcfill" style="height:100%"></div>
            <div class="tipfill" style="height:${tot?Math.round(b.tip/tot*100):0}%"></div>
          </div>
          <div class="cl">${b.label}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="legend">
      <span><i style="background:var(--rose)"></i>Services</span>
      <span><i style="background:var(--sage)"></i>Tips</span>
    </div>
    <div class="sec-t">Payments</div>
    ${pays.length?pays.map(a=>`
      <div class="pay-row">
        <div class="d">${niceDate(a.date,true)}</div>
        <div class="info"><div class="who">${esc(clientName(a.clientId))}</div><div class="svc">${esc(a.service)}${whoDid(a)?' · '+esc(whoDid(a)):''}${a.payment.method?' · '+a.payment.method:''}${a.payment.processor?' ('+a.payment.processor+')':''}</div></div>
        <div class="amts"><div class="a">${fmt$(a.payment.amount+a.payment.tip)}</div>${a.payment.tip?`<div class="t">+${fmt$(a.payment.tip)} tip</div>`:''}</div>
      </div>`).join('')
    :`<div class="empty">No payments in this period yet.</div>`}
    ${earnStaff==='all'?`<div class="sec-t">Expenses</div>
    ${exps.length?exps.map(e=>`
      <div class="exp-row tap" data-id="${e.id}" role="button" tabindex="0">
        <div class="d">${niceDate(e.date,true)}</div>
        <div class="info"><div class="cat">${esc(e.category)}</div>${e.note?`<div class="nt">${esc(e.note)}</div>`:''}</div>
        <div class="a">\u2212${fmt$(e.amount)}</div>
      </div>`).join('')
    :`<div class="empty">No expenses recorded.<br>Tap + to add supplies, rent, utilities\u2026</div>`}`:''}
  `;
  main.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{earnMode=b.dataset.m;render();});
  const stF=document.getElementById('stFilter');
  if(stF)stF.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{earnStaff=c.dataset.st;render();});
  main.querySelectorAll('.exp-row').forEach(el=>{

/* =========================================================
   CSV EXPORT / IMPORT
   One file holds both appointments and expenses (Type column).
   ========================================================= */
const CSV_COLS=['Type','Date','Time','Client','Phone','Service','Stylist','Amount','Tip','Total','Method','Status','Category','Note'];
function csvCell(v){
  const s=(v==null?'':String(v));
  return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
}
function buildCSV(){
  const rows=[CSV_COLS.join(',')];
  db.appts.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).forEach(a=>{
    const c=db.clients.find(x=>x.id===a.clientId);
    const p=a.payment||{};
    const amt=a.status==='done'?(p.amount||0):(a.price||0);
    const tip=a.status==='done'?(p.tip||0):0;
    rows.push([
      'Appointment',a.date,a.time,c?c.name:'Walk-in',c?(c.phone||''):'',a.service,
      (!a.staffId||a.staffId==='me')?meLabel():staffName(a.staffId),
      amt,tip,(amt+tip),p.method||'',a.status,'',c?(c.notes||''):''
    ].map(csvCell).join(','));
  });
  db.expenses.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{
    rows.push(['Expense',e.date,'','','','','',e.amount,0,e.amount,'','',e.category,e.note||''].map(csvCell).join(','));
  });
  return rows.join('\r\n');
}
function exportCSV(){
  const blob=new Blob(['\ufeff'+buildCSV()],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='salon-studio-'+todayStr()+'.csv';
  a.click();URL.revokeObjectURL(a.href);
  toast('CSV downloaded');
}
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=ch;
    }else{
      if(ch==='"')q=true;
      else if(ch===','){row.push(cur);cur='';}
      else if(ch==='\n'){row.push(cur);cur='';rows.push(row);row=[];}
      else if(ch!=='\r')cur+=ch;
    }
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
function importCSV(file){
  const rd=new FileReader();
  rd.onload=()=>{
    let rows;
    try{rows=parseCSV(rd.result);}catch(e){toast('Could not read that file');return;}
    if(!rows.length){toast('That file is empty');return;}
    const head=rows[0].map(h=>h.trim().toLowerCase());
    const col=n=>head.indexOf(n);
    if(col('type')<0||col('date')<0){toast('Not a Salon Studio CSV');return;}
    const get=(r,n)=>{const i=col(n);return i<0?'':(r[i]||'').trim();};
    const num=v=>{const n=parseFloat(String(v).replace(/[$,]/g,''));return isNaN(n)?0:n;};
    let addedA=0,addedE=0,newC=0;
    const bodies=rows.slice(1);
    if(!confirm('Add '+bodies.length+' rows from this file to your current data? Nothing is deleted.'))return;
    bodies.forEach(r=>{
      const type=get(r,'type').toLowerCase();
      const date=get(r,'date');
      if(!date)return;
      if(type==='expense'){
        db.expenses.push({id:uid(),category:get(r,'category')||'Other',amount:num(get(r,'amount')),date,note:get(r,'note')});
        addedE++;
      }else if(type==='appointment'){
        const nm=get(r,'client');
        let cid='';
        if(nm&&nm.toLowerCase()!=='walk-in'){
          let c=db.clients.find(x=>x.name.toLowerCase()===nm.toLowerCase());
          if(!c){c={id:uid(),name:nm,phone:get(r,'phone'),notes:get(r,'note')};db.clients.push(c);newC++;}
          cid=c.id;
        }
        const stName=get(r,'stylist');
        let stId='me';
        if(stName&&stName.toLowerCase()!==meLabel().toLowerCase()){
          let s=db.staff.find(x=>x.name.toLowerCase()===stName.toLowerCase());
          if(s)stId=s.id;
        }
        const amount=num(get(r,'amount')),tip=num(get(r,'tip'));
        const status=(get(r,'status')||'done').toLowerCase();
        db.appts.push({
          id:uid(),clientId:cid,service:get(r,'service')||'Other',date,
          time:get(r,'time')||'12:00',price:amount,staffId:stId,
          status:['booked','done','cancelled'].includes(status)?status:'done',
          payment:status==='booked'?null:{amount,tip,method:get(r,'method')}
        });
        addedA++;
      }
    });
    save();closeSheet();render();
    toast('Added '+addedA+' bookings, '+addedE+' expenses');
  };
  rd.readAsText(file);
}

    <div class="fld"><label>Square Application ID</label>
      <input id="sqId" value="${esc((db.square&&db.square.appId)||'')}" placeholder="${SQ_DEFAULT_APP_ID?'Built in':'sq0idp-\u2026'}" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    <button class="btn btn-ghost" id="sqSave">Save Square settings</button>
    <div class="sec-t" style="margin-top:22px">Cash App \u00b7 Venmo \u00b7 Zelle</div>
    <div class="note" style="margin-bottom:10px">At checkout, Chairbook shows your client a QR code (Cash App, Venmo) or your Zelle contact with the amount. Fill in only the ones you use.</div>
    ${Object.values(P2P).map(P=>`<div class="fld"><label>${P.label}</label>
      <input id="ph-${P.key}" value="${esc(payHandles()[P.key]||'')}" placeholder="${esc(P.ph)}" autocomplete="off" autocapitalize="off" spellcheck="false"></div>`).join('')}
    <button class="btn btn-ghost" id="p2pSave">Save payment apps</button>
    <div class="sec-t" style="margin-top:22px">Your data</div>
    <div class="note" style="margin-bottom:12px">Everything is stored only on this phone. Save a backup file once in a while so nothing is ever lost.</div>
    <button class="btn btn-ink" id="expB">Download backup file</button>
    <button class="btn btn-ghost" id="impB">Restore from backup</button>
    <div class="sec-t" style="margin-top:18px">Spreadsheet (CSV)</div>
    <div class="note" style="margin-bottom:12px">Opens in Excel or Numbers \u2014 useful for your accountant, and it can be brought back in later.</div>
    <button class="btn btn-ghost" id="csvOutB">Export to CSV</button>
    <button class="btn btn-ghost" id="csvInB">Import from CSV</button>
    <button class="btn-danger-ghost" id="wipeB" style="width:100%">Erase all data (start fresh)</button>
    <input type="file" id="impF" accept="application/json" style="display:none">
    <input type="file" id="csvF" accept=".csv,text/csv" style="display:none">
  `);
  document.getElementById('p2pSave').onclick=()=>{
    const H=payHandles();Object.values(P2P).forEach(P=>{H[P.key]=P.clean(document.getElementById('ph-'+P.key).value);});
    save();toast('Payment apps saved');backupSheet();
  };
  document.getElementById('sqSave').onclick=()=>{
    db.square={appId:document.getElementById('sqId').value.trim()};save();toast('Square settings saved');
  };
  document.getElementById('saveOwn').onclick=()=>{
    db.owner={name:document.getElementById('ownName').value.trim()};
    save();render();toast('Saved');
  };
  document.getElementById('expB').onclick=()=>{
    const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='salon-studio-backup-'+todayStr()+'.json';
    a.click();URL.revokeObjectURL(a.href);toast('Backup downloaded');
  };
  const f=document.getElementById('impF');
  document.getElementById('csvOutB').onclick=exportCSV;
  const cf=document.getElementById('csvF');
  document.getElementById('csvInB').onclick=()=>cf.click();
  cf.onchange=()=>{const file=cf.files[0];if(file)importCSV(file);};
  document.getElementById('teamB').onclick=teamSheet;
  document.getElementById('impB').onclick=()=>f.click();
  document.getElementById('wipeB').onclick=()=>{
    if(!confirm('Erase ALL data on this phone? This cannot be undone. (Download a backup first if unsure.)'))return;
    db={appts:[],clients:[],expenses:[],staff:[],owner:{name:''}};earnStaff='all';save();closeSheet();render();toast('All data erased');
  };
  f.onchange=()=>{
    const file=f.files[0];if(!file)return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const d=JSON.parse(rd.result);
        if(!d.appts||!d.clients)throw 0;
        if(!d.expenses)d.expenses=[];
        if(!d.staff)d.staff=[];
        if(!d.owner)d.owner={name:''};
        if(!confirm('Replace current data with this backup?'))return;
        db=d;save();closeSheet();render();toast('Backup restored');
      }catch(e){toast('That file is not a valid backup');}
    };
    rd.readAsText(file);
  };
}

render();
sqCheckReturn();
</script>
</body>
</html>
